name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build
        env:
          SECRET_KEY: "ci-lighthouse-secret-key-not-for-production"
          DATABASE_PATH: "/tmp/lighthouse-linkbreeze.db"

      # Seed a minimal DB so the app has a profile + public page.
      # Without this, the homepage redirects to /setup and Lighthouse audits a
      # redirect instead of the actual public page.
      - name: Seed database
        env:
          DATABASE_PATH: "/tmp/lighthouse-linkbreeze.db"
          SECRET_KEY: "ci-lighthouse-secret-key-not-for-production"
        run: npx tsx src/scripts/seed-lighthouse.ts

      - name: Start server
        run: |
          # output: standalone needs static assets copied next to server.js.
          # In CI the checkout is flat, so server.js is at .next/standalone/server.js.
          # In nested local dirs it may be under subdirs — find handles both.
          STANDALONE_DIR=$(dirname $(find .next/standalone -name server.js -not -path "*/node_modules/*" | head -1))
          cp -r .next/static "$STANDALONE_DIR/.next/static"
          cp -r public "$STANDALONE_DIR/public"
          cd "$STANDALONE_DIR"
          node server.js &
          npx wait-on http://localhost:3000/test --timeout 60000
        env:
          SECRET_KEY: "ci-lighthouse-secret-key-not-for-production"
          DATABASE_PATH: "/tmp/lighthouse-linkbreeze.db"
          PORT: "3000"

      - name: Run Lighthouse CI
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci autorun --upload.target=temporary-public-storage || echo "LHCI warnings — check report artifact"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
