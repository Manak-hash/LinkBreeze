name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_test:
        description: "Build AND push ghcr.io/manak-hash/linkbreeze:test (multi-arch, no version tag, no GitHub release)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  setup:
    name: Determine publish mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Set publish mode
        id: mode
        run: |
          # dispatch + publish_test=false -> dry-run | dispatch + true -> test tag | tag push -> release
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.publish_test }}" = "true" ]; then
            echo "mode=test" >> "$GITHUB_OUTPUT"
          else
            echo "mode=dryrun" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          # GHCR requires lowercase image names
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dry-run path (workflow_dispatch, publish_test=false): build only, push nothing.
      - name: Build (dry-run)
        if: needs.setup.outputs.mode == 'dryrun'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      # Test + release paths (publish): push the per-platform image by digest;
      # the manifest list is assembled by the merge job.
      - name: Build and push by digest
        id: build
        if: needs.setup.outputs.mode != 'dryrun'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: needs.setup.outputs.mode != 'dryrun'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.setup.outputs.mode != 'dryrun'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest list
    if: needs.setup.outputs.mode != 'dryrun'
    runs-on: ubuntu-latest
    needs: [setup, build]
    steps:
      - name: Prepare
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release path: latest + <version> tags. Test path: just :test.
      - name: Docker meta (release)
        if: needs.setup.outputs.mode == 'release'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}

      - name: Docker meta (test)
        if: needs.setup.outputs.mode == 'test'
        id: meta-test
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=test

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          tags="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          digests="$(printf "${{ env.IMAGE }}@sha256:%s " *)"
          # Intentional word splitting: $tags and $digests are multi-word arg lists.
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $digests

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version || steps.meta-test.outputs.version }}"
