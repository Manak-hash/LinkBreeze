services:
  linkbreeze-demo:
    image: ghcr.io/manak-hash/linkbreeze:1.2.3
    ports:
      - "3010:3000"
    volumes:
      - ./data-demo:/app/data
    environment:
      - DATABASE_PATH=/app/data/linkbreeze.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEMO_MODE=true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
